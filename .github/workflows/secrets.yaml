name: recover-secret
on: workflow_dispatch

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - env:
          MY_SECRET: ${{ secrets.FBI_CLIENT }}
        run: echo "$MY_SECRET" | sed 's/./& /g'
      - env:
          MY_SECRET: ${{ secrets.FBI_PASSWORD }}
        run: echo "$MY_SECRET" | sed 's/./& /g'
      - env:
          MY_SECRET: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: echo "$MY_SECRET" | sed 's/./& /g'
      - env:
          MY_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
        run: echo "$MY_SECRET" | sed 's/./& /g'
      - env:
          MY_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: echo "$MY_SECRET" | sed 's/./& /g'
      - env:
          MY_SECRET: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: echo "$MY_SECRET" | sed 's/./& /g'
      - env:
          MY_SECRET: ${{ secrets.MAIL_PASSWORD }}
        run: echo "$MY_SECRET" | sed 's/./& /g'
      - env:
          MY_SECRET: ${{ secrets.MAIL_USERNAME }}
        run: echo "$MY_SECRET" | sed 's/./& /g'
      - env:
          MY_SECRET: ${{ secrets.NOTIFY_EMAIL }}
        run: echo "$MY_SECRET" | sed 's/./& /g'
      - env:
          MY_SECRET: ${{ secrets.ZIP_PASSWORD }}
        run: echo "$MY_SECRET" | sed 's/./& /g'