name: Weekly Export FFBB

on:
  schedule:
    - cron: '0 8 * * 2'
  workflow_dispatch:

permissions:
  contents: write   # nécessaire pour push

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - run: npm install

      - run: node scripts/fbi-client.js
        env:
          FBI_CLIENT: ${{ secrets.FBI_CLIENT }}
          FBI_PASSWORD: ${{ secrets.FBI_PASSWORD }}

      - name: Commit et push si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rencontres/rencontres.xlsx
          git diff --staged --quiet || git commit -m "Mise à jour automatique des résultats FFBB"
          git push

      - name: Déclencher le workflow Generate Agenda
        run: gh workflow run generate-agenda.yml