name: XLS to JSON

on:
  push:
    paths:
      - "data/rencontres/**/*.xlsx"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Get XLS file name
        id: getfile
        run: |
          FILE=$(git diff --name-only HEAD~1 HEAD | grep 'data/rencontres/.*\.xlsx$' | tail -1)
          echo "=== FILE FOUND ==="
          echo "$FILE"
          echo "file=$FILE" >> $GITHUB_OUTPUT

      - name: Debug file
        run: |
          echo "File found: ${{ steps.getfile.outputs.file }}"

      - name: Convert XLS to JSON
        run: |
          node scripts/matchs-xls-to-json.js ${{ steps.getfile.outputs.file }}