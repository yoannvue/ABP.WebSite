name: XLS to JSON

on:
  push:
    paths:
      - "data/rencontres/**/*.xlsx"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Get XLS file name
        id: getfile
        run: |
          FILE=$(git diff --name-only HEAD~1 HEAD | grep 'data/rencontres/.*\.xlsx$' | tail -1)
          echo "=== FILE FOUND ==="
          echo "$FILE"
          echo "file=$FILE" >> $GITHUB_OUTPUT

      - name: Convert XLS to JSON
        run: |
          node scripts/matchs-xls-to-json.js ${{ steps.getfile.outputs.file }}

      - name: Commit and push JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/rencontres.json
          git diff --cached --quiet || git commit -m "chore: update rencontres.json from ${{ steps.getfile.outputs.file }}"
          git push