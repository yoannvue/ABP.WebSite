name: XLS to JSON

on:
  push:
    paths:
      - "data/rencontres/**/*.xlsx"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Get XLS file name
        id: getfile
        run: |
          FILE=$(git diff --name-only --diff-filter=d HEAD~1 HEAD | grep 'data/rencontres/.*\.xlsx$' | tail -1)
          if [ -z "$FILE" ]; then
            echo "Aucun fichier XLSX trouvé dans ce commit."
          else
            echo "Fichier détecté : $FILE"
          fi
          echo "file=$FILE" >> $GITHUB_OUTPUT

      - name: Convert XLS to JSON
        if: steps.getfile.outputs.file != ''
        run: |
          node scripts/matchs-xls-to-json.js ${{ steps.getfile.outputs.file }}

      - name: Commit and push JSON
        if: steps.getfile.outputs.file != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/rencontres.json
          git diff --cached --quiet || git commit -m "chore: update rencontres.json from ${{ steps.getfile.outputs.file }}"
          git push

      - name: Generate image
        if: steps.getfile.outputs.file != ''
        run: node scripts/matchs-div-to-image.js

      - name: Commit image
        if: steps.getfile.outputs.file != ''
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          shopt -s nullglob
          FILES=(data/rencontres/*.png)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "Aucune image PNG trouvée, rien à committer."
            exit 0
          fi
          git add "${FILES[@]}"
          git diff --cached --quiet || git commit -m "Ajout de l'image de la semaine"
          git diff --cached --quiet || git push

      - name: Générer la Sheet
        if: steps.getfile.outputs.file != ''
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          MATCHS_JSON_PATH: "docs/rencontres.json"
        run: node matchs-json-to-sheet.js