name: XLS to JSON

on:
  push:
    paths:
      - "data/rencontres/**/*.xlsx"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Get XLS file name
        id: getfile
        run: |
          FILE=""
          COMMITS='${{ toJson(github.event.commits) }}'

          echo "$COMMITS" | sed 's/},{/} {/g' | while read -r commit; do
            ADDED=$(echo "$commit" | grep -o '"added":\[[^]]*\]' | sed 's/"added":\[\(.*\)\]/\1/' | tr -d '"' | tr ',' '\n')
            MODIFIED=$(echo "$commit" | grep -o '"modified":\[[^]]*\]' | sed 's/"modified":\[\(.*\)\]/\1/' | tr -d '"' | tr ',' '\n')

            for f in $ADDED $MODIFIED; do
              if [[ "$f" == *.xlsx ]]; then
                FILE="$f"
              fi
            done
          done

          echo "file=$FILE" >> $GITHUB_OUTPUT

      - name: Debug file
        run: echo "Fichier détecté: ${{ steps.getfile.outputs.file }}"

      - name: Convert XLS to JSON
        run: node scripts/matchs-xls-to-json.js ${{ steps.getfile.outputs.file }}