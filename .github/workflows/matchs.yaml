name: Generate Agenda

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Get XLS file name
        id: getfile
        run: echo "file=data/rencontres/rencontres.xlsx" >> $GITHUB_OUTPUT

      - name: Convert XLS to JSON
        if: steps.getfile.outputs.file != ''
        run: |
          node scripts/matchs-xls-to-json.js ${{ steps.getfile.outputs.file }}

      - name: Commit and push JSON
        if: steps.getfile.outputs.file != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/rencontres.json
          git diff --cached --quiet || git commit -m "chore: update rencontres.json from ${{ steps.getfile.outputs.file }}"
          git push

      - name: Generate image
        if: steps.getfile.outputs.file != ''
        run: node scripts/matchs-div-to-image.js

      - name: Commit image
        if: steps.getfile.outputs.file != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rencontres/rencontres.png
          git diff --cached --quiet || git commit -m "chore: Ajout de l'image de la semaine"
          git push

      - name: Générer la Sheet
        id: gensheet
        if: steps.getfile.outputs.file != ''
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          MATCHS_JSON_PATH: "docs/rencontres.json"
        run: node scripts/matchs-json-to-sheet.js

      - name: Envoyer le mail
        if: steps.getfile.outputs.file != '' && steps.gensheet.outputs.sheet_url != ''
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Planning généré"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: ABP WebSite Bot
          html_body: |
            <p>La feuille de la semaine est disponible ici : <a href="${{ steps.gensheet.outputs.sheet_url }}">${{ steps.gensheet.outputs.sheet_url }}</a></p>
            <img src="https://abpecquencourt.fr/data/rencontres/rencontres.png" alt="Affiche de la semaine" style="max-width:600px;" />