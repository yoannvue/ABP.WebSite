name: XLS to JSON

on:
  push:
    paths:
      - "data/rencontres/**/*.xlsx"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Debug commits payload
        run: |
          echo "=== RAW COMMITS ==="
          echo '${{ toJson(github.event.commits) }}'

      - name: Get XLS file name
        id: getfile
        run: |
          COMMITS='${{ toJson(github.event.commits) }}'
          echo "=== ADDED FILES ==="
          echo "$COMMITS" | jq -r '.[].added // [] | .[]'
          echo "=== MODIFIED FILES ==="
          echo "$COMMITS" | jq -r '.[].modified // [] | .[]'
          FILE=$(echo "$COMMITS" \
            | jq -r '[.[].added // [], .[].modified // []] | flatten | map(select(endswith(".xlsx"))) | last // ""')
          echo "=== FILE FOUND ==="
          echo "$FILE"
          echo "file=$FILE" >> $GITHUB_OUTPUT

      - name: Debug file
        run: |
          echo "File found: ${{ steps.getfile.outputs.file }}"

      - name: Convert XLS to JSON
        run: |
          node scripts/matchs-xls-to-json.js ${{ steps.getfile.outputs.file }}