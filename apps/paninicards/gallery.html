<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galerie - Collection Panini ABP Basketball</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-layout">

    <!-- Sidebar / Barre de navigation -->
    <nav class="sidebar">
      <div class="sidebar-logo">
        <img src="../../ressources/logo-abp.png" alt="ABP Basketball" class="logo-full">
        <img src="../../ressources/logo-abp.png" alt="ABP" class="logo-icon">
      </div>
      <div class="sidebar-nav">
        <a href="index.html" class="nav-link">
          <span class="nav-icon">🎲</span>
          <span class="nav-label">Tirage du jour</span>
        </a>
        <a href="gallery.html" class="nav-link active">
          <span class="nav-icon">🃏</span>
          <span class="nav-label">Collection</span>
        </a>
        <a href="stats.html" class="nav-link">
          <span class="nav-icon">📊</span>
          <span class="nav-label">Mes stats</span>
        </a>
      </div>
    </nav>

    <!-- Contenu principal -->
    <main class="main-content">
      <section>
        <div style="margin-left:8px;">
          <h2>Galerie des cartes</h2>
          <p>Découvrez toutes les cartes disponibles dans la collection ABP Basketball. Cliquez sur une carte pour voir plus de détails.</p>

          <div id="progress-section" class="progress-section">
            <h3>Votre progression</h3>
            <div class="progress-bar">
              <div id="progress-fill" class="progress-fill"></div>
            </div>
            <p id="progress-text">0/10 cartes</p>
          </div>
          <br>
          <!-- Galerie des cartes -->
          <section id="gallery" class="gallery"></section>
        </div>
      </section>
    </main>
  </div>

  <!-- Modal pour détails carte -->
  <div id="card-modal" class="card-modal" style="display: none;">
    <div class="modal-content">
      <button class="modal-close">&times;</button>
      <img id="modal-image" src="" alt="">
      <h2 id="modal-title"></h2>
      <p><strong>Catégorie :</strong> <span id="modal-category"></span></p>
      <p><strong>Possession :</strong> <span id="modal-owned"></span></p>
      <p><strong>Rareté :</strong> <span id="modal-rarity"></span></p>
    </div>
  </div>
  <!-- Scripts modulaires -->
  <script type="module" src="js/gallery-page.js"></script>
  <script src="/js/analytics.js"></script>
</body>
</html>
